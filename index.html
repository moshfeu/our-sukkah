<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our Sukkah - 4D assembly model</title>
<style>
  body { margin: 0; overflow: hidden; font-family: sans-serif; background: #eef3f7; }
  #ui { position: absolute; top: 10px; left: 10px; background: rgba(255,255,255,0.92);
        padding: 12px; border-radius: 8px; width: 340px; }
  #ui input[type=range] { width: 100%; margin-top: 8px; }
  #inv { font-size: 13px; margin-top: 8px; white-space: pre-line; }
  #summaryBtn { position: absolute; bottom: 10px; left: 10px; width: 36px; height: 36px;
                border-radius: 50%; border: none; background: #1e3a5f; color: #fff;
                font: bold 20px serif; font-style: italic; cursor: pointer;
                box-shadow: 0 2px 6px rgba(0,0,0,0.3); }
  #summaryBtn:hover { background: #2c5282; }
  #layers { position: absolute; top: 10px; right: 10px; background: rgba(255,255,255,0.92);
            padding: 10px 14px; border-radius: 8px; font-size: 14px; line-height: 1.8; }
  @media (max-width: 600px) {
    #ui { width: auto; right: 10px; padding: 8px; font-size: 12px; }
    #layers { top: 8px; right: 8px; padding: 6px 8px; font-size: 12px; line-height: 1.5; }
    #summaryBtn { width: 32px; height: 32px; font-size: 17px; bottom: 12px; left: 12px; }
  }
</style>
</head>
<body>
<button id="summaryBtn" title="Show / hide details">i</button>
<div id="ui" style="display: none;">
  <b>Our Sukkah - assembly (4D = 3D + build time)</b><br>
  <div id="inv"></div>
</div>

<div id="layers">
  <label><input type="checkbox" data-cat="walls" checked> Wall panels</label><br>
  <label><input type="checkbox" data-cat="lower" checked> Lower slats</label><br>
  <label><input type="checkbox" data-cat="schah" checked> Schah (mat and fronds)</label><br>
  <label><input type="checkbox" data-cat="upper" checked> Upper slats</label>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// Units: cm. Y is up. X = east(+)/west(-), Z = south(+)/north(-).
const W = 80, H = 220, T = 3, N = 16;
const DOOR = 14;            // middle panel of the west wall
const SCREW_Y = [50, 170];  // 50cm from bottom and from top

// Closed loop of 16 panels (one per 80cm of perimeter).
// Footprint: 400cm (E-W) x 240cm (N-S). N/S walls: 5 panels, E/W walls: 3 panels.
const segs = [];
const add = (ax, az, bx, bz, side) => segs.push({ ax, az, bx, bz, side });
for (let i = 0; i < 5; i++) add(-200 + 80 * i, -120, -120 + 80 * i, -120, 'North');
for (let i = 0; i < 3; i++) add(200, -120 + 80 * i, 200, -40 + 80 * i, 'East');
for (let i = 0; i < 5; i++) add(200 - 80 * i, 120, 120 - 80 * i, 120, 'South');
for (let i = 0; i < 3; i++) add(-200, 120 - 80 * i, -200, 40 - 80 * i, 'West');

// Scene
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeef3f7);
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 1, 5000);
camera.position.set(550, 380, 550);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 110, 0);
// Restore the saved view so a refresh keeps the same position
try {
  const saved = JSON.parse(localStorage.getItem('sukkahView'));
  if (saved) {
    camera.position.fromArray(saved.pos);
    controls.target.fromArray(saved.target);
  }
} catch (e) { /* no saved view */ }
controls.addEventListener('change', () => {
  try {
    localStorage.setItem('sukkahView', JSON.stringify({
      pos: camera.position.toArray(), target: controls.target.toArray()
    }));
  } catch (e) { /* storage unavailable */ }
});
controls.update();
// Hold Space + drag the left mouse button to move around (pan); release Space to rotate again
window.addEventListener('keydown', e => {
  if (e.code === 'Space' && !e.repeat) {
    e.preventDefault();
    controls.mouseButtons.LEFT = THREE.MOUSE.PAN;
  }
});
window.addEventListener('keyup', e => {
  if (e.code === 'Space') controls.mouseButtons.LEFT = THREE.MOUSE.ROTATE;
});
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const sun = new THREE.DirectionalLight(0xffffff, 0.8);
sun.position.set(300, 600, 400);
scene.add(sun);
scene.add(new THREE.GridHelper(1000, 50));

// Layer groups: objects added while currentCat is set go into that group
const CATS = {
  walls: new THREE.Group(), lower: new THREE.Group(),
  schah: new THREE.Group(), upper: new THREE.Group()
};
Object.values(CATS).forEach(g => scene.add(g));
let currentCat = null;
function setCat(c) { currentCat = c; }
const _addToScene = scene.add.bind(scene);
scene.add = (...objs) => {
  objs.forEach(o => (currentCat ? CATS[currentCat].add(o) : _addToScene(o)));
  return scene;
};

const woodMat = new THREE.MeshLambertMaterial({ color: 0xc8a26b });
const doorMat = new THREE.MeshLambertMaterial({ color: 0x8b5a2b });
const metalMat = new THREE.MeshLambertMaterial({ color: 0xaaaaaa });
const nutMat = new THREE.MeshLambertMaterial({ color: 0x777777 });
const battenMat = new THREE.MeshLambertMaterial({ color: 0xa9803f });

// Panels + joints (2 screws + nuts at each seam).
// Joint k sits at the start point of panel k, i.e. the seam between panel k-1 and k.
setCat('walls');
const parts = segs.map((s, k) => {
  const dx = (s.bx - s.ax) / W, dz = (s.bz - s.az) / W;
  const cx = (s.ax + s.bx) / 2, cz = (s.az + s.bz) / 2;
  const theta = Math.atan2(-dz, dx);
  // sig = +1 if the panel's local +z faces outward (away from the centre)
  const sig = (Math.sin(theta) * cx + Math.cos(theta) * cz) > 0 ? 1 : -1;
  const wood = k === DOOR ? doorMat : woodMat;
  const batten = k === DOOR ? doorMat : battenMat;

  // Panel = thin 1cm skin on the inside + 2cm batten frame on the outside (3cm total)
  const mesh = new THREE.Group();
  mesh.position.set(cx, 0, cz);
  mesh.rotation.y = theta;
  const skin = new THREE.Mesh(new THREE.BoxGeometry(W, H, 1), wood);
  skin.position.set(0, H / 2, -sig * 1);
  mesh.add(skin);
  [-1, 1].forEach(side => {
    const stile = new THREE.Mesh(new THREE.BoxGeometry(4, H, 2), batten);
    stile.position.set(side * (W / 2 - 2), H / 2, sig * 0.5);
    mesh.add(stile);
  });
  [2, 73, 147, 218].forEach(y => {
    const rail = new THREE.Mesh(new THREE.BoxGeometry(W - 8, 4, 2), batten);
    rail.position.set(0, y, sig * 0.5);
    mesh.add(rail);
  });
  if (k === DOOR) {
    // Door swings outward (west) on its south edge, where its bolts act as the hinge
    const pivot = new THREE.Group();
    pivot.position.set(-200, 0, 40);
    pivot.rotation.y = 0.5;              // ~29 degrees open
    mesh.position.set(0, 0, -40);        // door centre relative to the hinge
    pivot.add(mesh);
    // Vertical handle at mid-height (110cm), on the outer face near the free (north) edge
    // Handle sits on the outer face of the door's free-edge frame (stile at local x = +38)
    const handle = new THREE.Mesh(new THREE.BoxGeometry(2.5, 25, 2), metalMat);
    handle.position.set(38, 110, sig * 2.5);
    mesh.add(handle);
    // Two butt hinges on the right side of the door (its south edge), connecting it to panel 15.
    // Knuckle and door leaf turn with the door (inside the pivot); the wall leaf stays on panel 15.
    [45, 175].forEach(y => {
      const knuckle = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 0.9, 10, 8), metalMat);
      knuckle.position.set(-1.2, y, 0);
      const leafDoor = new THREE.Mesh(new THREE.BoxGeometry(0.4, 10, 4), metalMat);
      leafDoor.position.set(-1.5, y, -2);
      pivot.add(knuckle, leafDoor);
      const leafWall = new THREE.Mesh(new THREE.BoxGeometry(0.4, 10, 4), metalMat);
      leafWall.position.set(-201.7, y, 42);
      scene.add(leafWall);
    });
    scene.add(pivot);
  } else {
    scene.add(mesh);
  }

  // Joint: 2 bolts through the edge battens at the seam, head outside, nut inside
  const joint = new THREE.Group();
  joint.position.set(s.ax, 0, s.az);
  joint.rotation.y = theta;
  SCREW_Y.forEach(y => {
    const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 6.5, 8), metalMat);
    shaft.rotation.x = Math.PI / 2;
    shaft.position.set(3, y, 0);
    const head = new THREE.Mesh(new THREE.CylinderGeometry(1.3, 1.3, 0.8, 8), metalMat);
    head.rotation.x = Math.PI / 2;
    head.position.set(3, y, sig * 2.3);
    const nut = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.5, 1.5, 6), nutMat);
    nut.rotation.x = Math.PI / 2;
    nut.position.set(3, y, -sig * 2.3);
    joint.add(shaft, head, nut);
  });
  scene.add(joint);
  return { mesh, joint, k };
});

setCat('lower');
// Roof slat (part of the s'chach ladder): one 5cm slat running north-south, from
// panel 6 (north) to panel 10 (south). It sits on the west edge of those panels
// (x = 120..125), 75cm from the east wall (x = 200). Bolted vertically through the top
// rail of each panel, head facing down, nut on top of the slat.
const SLAT_Y = 221.5;
// Slat x-positions at the west edge of pairs (6,10), (5,11), (4,12), (3,13).
// The west slat for pair (2,14) sits on the west wall line, flush with its outside face
// (x = -201.5 to -196.5), so it reads as the top of the wall.
const SLAT_XS = [122.5, 42.5, -37.5, -117.5, -199];
const slatMat = new THREE.MeshLambertMaterial({ color: 0xb8894a });
SLAT_XS.forEach(SLAT_X => {
const slat = new THREE.Mesh(new THREE.BoxGeometry(5, 3, 243), slatMat);
slat.position.set(SLAT_X, SLAT_Y, 0);
scene.add(slat);
[-120, 120].forEach(z => {
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 15, 8), metalMat);
  shaft.position.set(SLAT_X, 218.5, z);
  const head = new THREE.Mesh(new THREE.CylinderGeometry(1.3, 1.3, 0.8, 8), metalMat);
  head.position.set(SLAT_X, 211.2, z);
  const nut = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.5, 1.5, 6), nutMat);
  nut.position.set(SLAT_X, 224.75, z);
  scene.add(shaft, head, nut);
});
});

// Long east-west slat: from the middle of panel 8 (east) to the middle of panel 16 (west door).
// It rests on top of the north-south slats (y = 223..226), centred on z = 0.
// The flexible slat's centre line (x, y), from east (upper frame of panel 8) to west.
// It rides over the first north-south slat, dips below the slats in the middle, and comes
// back up to the upper frame at the west end. Centre line is at z = 0.
const LS = [
  [200, 220.75], [160, 220.75], [140, 218.5], [-140, 218.5], [-160, 220.75], [-200, 220.75]
];
const longSlatCurve = new THREE.CatmullRomCurve3(LS.map(([x, y]) => new THREE.Vector3(x, y, 0)));
const longSlat = new THREE.Mesh(new THREE.TubeGeometry(longSlatCurve, 200, 1.5, 8), slatMat);
scene.add(longSlat);

// Height of the flexible slat above a given x (linear between the points above)
function longSlatY(x) {
  for (let i = 0; i < LS.length - 1; i++) {
    const [x1, y1] = LS[i], [x2, y2] = LS[i + 1];
    if (x <= x1 && x >= x2) return y1 + (y2 - y1) * ((x1 - x) / (x1 - x2));
  }
  return 220.75;
}
// Bolts where the long slat crosses each north-south slat: head under the N-S slat, nut on top
SLAT_XS.forEach(x => {
  // Bolt comes up from under the flexible slat (head below it), through the north-south slat,
  // with the nut on top of the north-south slat
  const low = longSlatY(x) - 2.3;      // head centre, under the flexible slat
  const high = 223.5;                  // top face of the north-south slat
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, high - low, 8), metalMat);
  shaft.position.set(x, (low + high) / 2, 0);
  const head = new THREE.Mesh(new THREE.CylinderGeometry(1.3, 1.3, 0.8, 8), metalMat);
  head.position.set(x, low, 0);
  const nut = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.5, 1.5, 6), nutMat);
  nut.position.set(x, high + 0.75, 0);
  scene.add(shaft, head, nut);
});

// Reed screening (s'chach): one 3.20m reed laid east to west on top of the slats,
// starting at the east wall (x = 200) and ending at x = -120, so the last 80cm (west) is open.
// Spans the full north-south depth of the slats (z = -121.5..121.5), resting on the bolt nuts.
setCat('schah');
// Bamboo mat texture: pale canes with thin dark gaps between them
const bambooCanvas = document.createElement('canvas');
bambooCanvas.width = 64; bambooCanvas.height = 64;
const bg = bambooCanvas.getContext('2d');
bg.fillStyle = '#d9bd74'; bg.fillRect(0, 0, 64, 64);
bg.fillStyle = '#8a6d35';
for (let x = 0; x < 64; x += 8) bg.fillRect(x, 0, 2, 64);
const bambooTex = new THREE.CanvasTexture(bambooCanvas);
bambooTex.wrapS = bambooTex.wrapT = THREE.RepeatWrapping;
bambooTex.repeat.set(40, 40);
// The mat lies exactly on top of the north-south slats (y = 223, mat 223..224.5).
// It covers the bolt nuts, which stay hidden unless the mat is removed.
const reed = new THREE.Mesh(
  new THREE.BoxGeometry(320, 3, 243),
  new THREE.MeshLambertMaterial({ map: bambooTex })
);
reed.position.set(40, 223 + 1.5, 0);
scene.add(reed);

// Palm fronds (s'chach) covering the open 80cm at the west end of the roof (x = -200..-120).
// Each frond: a central stem (rachis) with leaflets on both sides, lying north-south.
// Three fronds have their tip pointing south, three point north.
const palmMat = new THREE.MeshLambertMaterial({ color: 0x6f8f3a });
const rachisMat = new THREE.MeshLambertMaterial({ color: 0x5a7a2f });
const FROND_L = 236, LEAF_N = 24, LEAF_LEN = 15;
const leafGeo = new THREE.BoxGeometry(0.5, 0.15, LEAF_LEN);
function addFrond(x, tipDir) {  // tipDir +1 = tip to the south (+z), -1 = tip to the north
  const rachis = new THREE.Mesh(new THREE.BoxGeometry(0.9, 3, FROND_L), rachisMat);
  rachis.position.set(x, 227.5, 0);   // rests on the short slats (top at y = 226)
  scene.add(rachis);
  const a = 50 * Math.PI / 180;  // leaflet angle from the stem
  for (let i = 0; i < LEAF_N; i++) {
    const zi = -FROND_L / 2 + (i + 0.5) * (FROND_L / LEAF_N);
    [-1, 1].forEach(side => {
      const dx = side * Math.sin(a), dz = tipDir * Math.cos(a);
      const leaf = new THREE.Mesh(leafGeo, palmMat);
      leaf.position.set(x + dx * LEAF_LEN / 2, 227.5, zi + dz * LEAF_LEN / 2);
      leaf.rotation.y = Math.atan2(dx, dz);
      scene.add(leaf);
    });
  }
}
[-194.5, -180.5, -166.5].forEach(x => addFrond(x, +1));
[-152.5, -138.5, -124.5].forEach(x => addFrond(x, -1));

setCat('upper');
// Top slats: 4 north-south slats on top of the mat (pairs 6/10, 5/11, 4/12, 3/13; none for 2/14),
// so the mat won't fly in the wind. Each is tied to the bottom slat below at both ends with flax rope.
const TOP_SLAT_XS = [122.5, 42.5, -37.5, -117.5];
const flaxMat = new THREE.MeshLambertMaterial({ color: 0xd8c9a0 });
TOP_SLAT_XS.forEach(x => {
  const topSlat = new THREE.Mesh(new THREE.BoxGeometry(5, 3, 243), slatMat);
  topSlat.position.set(x, 227.5, 0);   // sits on top of the mat (mat top = 226)
  scene.add(topSlat);
  // Flax rope from the bottom slat (y = 220) up to the top of the top slat (y = 229.5), at each end
  [-119, 119].forEach(z => {
    const rope = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 9.5, 6), flaxMat);
    rope.position.set(x, 224.75, z);
    scene.add(rope);
  });
});

// Two short east-west slats (80cm), from the west-wall slat (5w) to the 4w slat, at the middle
// of west-wall panels 1 (z = -80) and 15 (z = +80). They support the palm fronds, at mat height.
// Each runs from the west edge (x = -201.5) to the 4w slat (x = -117.5), about 84cm long.
// Bolted to the 5w upper slat (x = -199): head under 5w, nut on top of the short slat.
[-80, 80].forEach(z => {
  const shortSlat = new THREE.Mesh(new THREE.BoxGeometry(84, 3, 5), slatMat);
  shortSlat.position.set(-159.5, 224.5, z);  // x = -201.5..-117.5
  scene.add(shortSlat);

  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 227.5 - 218.8, 8), metalMat);
  shaft.position.set(-199, (218.8 + 227.5) / 2, z);
  const head = new THREE.Mesh(new THREE.CylinderGeometry(1.3, 1.3, 0.8, 8), metalMat);
  head.position.set(-199, 219.4, z);
  const nut = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.5, 1.5, 6), nutMat);
  nut.position.set(-199, 226.75, z);
  scene.add(shaft, head, nut);
});

setCat(null);
// Panel numbers: 1 = west wall, north of door; then clockwise; 15 = west south of door; 16 = door
function panelNumber(c) {
  if (c === 15) return 1;
  if (c === 13) return 15;
  if (c === 14) return 16;
  return c + 2;
}
segs.forEach((s, c) => {
  const cv = document.createElement('canvas');
  cv.width = 128; cv.height = 128;
  const g = cv.getContext('2d');
  g.beginPath(); g.arc(64, 64, 60, 0, Math.PI * 2);
  g.fillStyle = c === DOOR ? '#ffe08a' : '#ffffff'; g.fill();
  g.lineWidth = 6; g.strokeStyle = '#333'; g.stroke();
  g.fillStyle = '#000'; g.font = 'bold 72px sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(String(panelNumber(c)), 64, 68);
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
    map: new THREE.CanvasTexture(cv), depthTest: false
  }));
  sprite.scale.set(22, 22, 1);
  sprite.position.set((s.ax + s.bx) / 2, 180, (s.az + s.bz) / 2);
  scene.add(sprite);
});

// Compass labels, placed outside the sukkah (N = -Z, S = +Z, E = +X, W = -X)
function textSprite(text, x, y, z, width = 80, canvasW = 256) {
  const cv = document.createElement('canvas');
  cv.width = canvasW; cv.height = 128;
  const g = cv.getContext('2d');
  g.fillStyle = '#1e3a5f'; g.font = 'bold 96px sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(text, canvasW / 2, 64);
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
    map: new THREE.CanvasTexture(cv), depthTest: false
  }));
  sprite.scale.set(width, width * 128 / canvasW, 1);
  sprite.position.set(x, y, z);
  scene.add(sprite);
}
textSprite('NORTH', 0, 40, -270, 120, 512);
textSprite('SOUTH', 0, 40, 270, 120, 512);
textSprite('EAST', 340, 40, 0, 120, 512);
textSprite('WEST', -340, 40, 0, 120, 512);

// North-south slat labels: 1 = far east, then westward. w↓ = bottom slat, w↑ = top slat.
// Labels sit at the north end of each slat.
[[1, 122.5], [2, 42.5], [3, -37.5], [4, -117.5], [5, -199]].forEach(([n, x]) => {
  textSprite(`${n}w↓`, x, 212, -135, 8);
  if (n <= 4) textSprite(`${n}w↑`, x, 233, -135, 8);  // the top slats exist for 1-4 only
});

// 4th dimension: t in [0,16]. Panel k is lowered into place during t in [k, k+1].
// Its joint appears once panel k and the previous panel are in place.
function update(t) {
  parts.forEach(({ mesh, joint, k }) => {
    const p = Math.min(1, Math.max(0, t - k));
    const e = 1 - Math.pow(1 - p, 3);
    mesh.visible = p > 0;
    mesh.position.y = H / 2 + (1 - e) * 160;
    const prev = (k + N - 1) % N;
    const pp = Math.min(1, Math.max(0, t - prev));
    joint.visible = p >= 1 && pp >= 1;
  });
  const s = Math.min(N - 1, Math.floor(t));
  const door = s === DOOR ? ' (DOOR)' : '';
  document.getElementById('label').textContent =
    t < 1 ? 'Start' : `Step ${s + 1}/16: panel ${s + 1}, ${segs[s].side}${door}`;
}

// Inventory
document.getElementById('inv').textContent =
`Inventory
- Panels: 16 wood, 80 x 220 x 3 cm (1 of them is the door, west middle)
- Joints: 16 seams x 2 = 32 screws, 32 nuts (at 50cm from bottom and 170cm)
- Footprint: 400 x 240 cm (E-W x N-S)
- Layout: N/S walls 5 panels, E/W walls 3 panels`;

// Summary panel show/hide
const summaryBtn = document.getElementById('summaryBtn');
const uiPanel = document.getElementById('ui');
summaryBtn.addEventListener('click', () => {
  uiPanel.style.display = uiPanel.style.display === 'none' ? '' : 'none';
});

// Layer checkboxes: show/hide each group
document.querySelectorAll('#layers input').forEach(cb => {
  cb.addEventListener('change', () => { CATS[cb.dataset.cat].visible = cb.checked; });
});

// Always show the complete Sukkah
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

function frame() {
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
parts.forEach(({ mesh, joint }) => { mesh.visible = true; joint.visible = true; });
requestAnimationFrame(frame);
</script>
</body>
</html>
